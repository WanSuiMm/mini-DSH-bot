<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dsh-bot · 我的 Agent 工作台</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><strong>dsh-bot</strong><span>个人 Agent 工作台</span></div><div id="connection">未连接</div></header>
<section id="login"><h1>把任务交给你的 Bot</h1><p>创建角色、保存偏好，让任务与结果持续留在这里。</p><form id="connect"><label>工作台访问令牌<input id="token" type="password" autocomplete="off" required></label><button>连接工作台</button></form><p class="muted">令牌仅在当前页面内存中使用。模型与工具权限由服务端配置。</p></section>
<main id="workspace" hidden><aside><div class="section-title"><h2>我的 Bots</h2><button id="new-bot" class="quiet">＋ 新建</button></div><div id="bots"></div><form id="bot-form" hidden><label>名字<input id="bot-name" maxlength="80" required></label><label>角色<input id="bot-role" maxlength="300" placeholder="如：技术资料助手" required></label><label>工作说明<textarea id="bot-instructions" maxlength="2000"></textarea></label><button>创建 Bot</button></form><button id="disconnect" class="quiet">断开连接</button></aside>
<section class="conversation"><div class="section-title"><div><h1 id="bot-title">选择一个 Bot</h1><p id="bot-description" class="muted"></p></div><div><button id="toggle-bot" class="quiet">暂停 Bot</button><button id="refresh" class="quiet">刷新</button></div></div><label class="conversation-id">会话<input id="conversation-id" value="main" maxlength="100"></label><div id="messages" aria-live="polite"><p class="muted">任务状态和结果将在这里保留。</p></div><form id="send"><label for="message">交代一个任务</label><textarea id="message" maxlength="12000" placeholder="告诉我需要完成什么，以及何时需要你确认……" required></textarea><div class="composer-footer"><span class="muted">可关闭页面，服务会继续处理已接收任务。</span><button>发送任务</button></div></form></section>
<aside class="details"><h2>这个 Bot 的记忆</h2><p class="muted">仅保存你明确写入的偏好与资料。</p><div id="memory"></div><form id="memory-form"><label>名称<input id="memory-id" maxlength="100" required></label><label>内容<textarea id="memory-value" maxlength="2000" required></textarea></label><button class="secondary">保存记忆</button></form><h2>例行任务</h2><div id="schedules"></div><form id="schedule-form"><label>任务<textarea id="schedule-text" maxlength="12000" required></textarea></label><label>间隔（分钟，至少 5）<input id="schedule-minutes" type="number" min="5" max="10080" value="60" required></label><button class="secondary">创建为暂停状态</button></form><p class="muted">启用后会按服务端模型配置执行任务，并消耗相应额度。</p></aside></main><div id="notice" role="status"></div><script type="module" src="/app.mjs"></script></body></html>
